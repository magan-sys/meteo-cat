name: previsión

# A las 7:00, 12:00, 17:00 y 21:00 (hora de Catalunya): descarga las últimas pasadas de
# los modelos y las observaciones XEMA, genera la previsión corregida y publica el panel.
#
# GitHub solo admite horarios en UTC. Se programan las dos horas UTC posibles de cada
# franja (horario de verano, UTC+2, y de invierno, UTC+1) y el trabajo `horario` descarta
# la que no corresponde a la hora local de ese día.
on:
  schedule:
    - cron: "0 5,10,15,19 * * *"  # 7, 12, 17 y 21 h en horario de verano
    - cron: "0 6,11,16,20 * * *"  # 7, 12, 17 y 21 h en horario de invierno
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  horario:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          run = True
          if os.environ["EVENT"] == "schedule":
              # Hora local de la ejecución programada (no de su inicio real, que puede retrasarse).
              now = datetime.now(timezone.utc)
              hours = [int(h) for h in os.environ["CRON"].split()[1].split(",")]
              local = {now.replace(hour=h, minute=0).astimezone(ZoneInfo("Europe/Madrid")).hour for h in hours}
              run = local <= {7, 12, 17, 21}
          print(f"run={'true' if run else 'false'}")
          PY

  forecast:
    needs: horario
    if: needs.horario.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: Caché de terreno y estaciones
        uses: actions/cache@v4
        with:
          path: |
            var/terrain
            var/history/stations.parquet
          key: static-${{ hashFiles('src/meteo_cat/terrain.py', 'src/meteo_cat/grid.py') }}

      - name: Terreno
        run: test -f var/terrain/terrain_0.01.npz || meteo-cat terrain

      - name: Previsión
        run: meteo-cat forecast --nowcast

      - name: Web estática
        run: meteo-cat publish --out site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
