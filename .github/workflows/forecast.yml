name: previsión

# Cada hora: descarga las últimas pasadas de los modelos y las observaciones XEMA,
# genera la previsión corregida y publica el panel en GitHub Pages.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: Caché de terreno y estaciones
        uses: actions/cache@v4
        with:
          path: |
            var/terrain
            var/history/stations.parquet
          key: static-${{ hashFiles('src/meteo_cat/terrain.py', 'src/meteo_cat/grid.py') }}

      - name: Terreno
        run: test -f var/terrain/terrain_0.01.npz || meteo-cat terrain

      - name: Previsión
        run: meteo-cat forecast --nowcast

      - name: Web estática
        run: meteo-cat publish --out site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
