<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meteo Catalunya</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  color-scheme: light;
  --surface: #fcfcfb;
  --panel: #ffffff;
  --border: #e4e3de;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #7a7974;
  --grid: #ecebe7;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --accent: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface: #1a1a19; --panel: #232322; --border: #383835;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --grid: #2e2e2c; --series-1: #3987e5; --series-2: #d95926; --accent: #3987e5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface: #1a1a19; --panel: #232322; --border: #383835;
  --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
  --grid: #2e2e2c; --series-1: #3987e5; --series-2: #d95926; --accent: #3987e5;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--surface); color: var(--text-primary);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  display: grid; grid-template-rows: auto auto 1fr auto; height: 100vh;
}
header { padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; }
header h1 { font-size: 18px; margin: 0; }
header .sub { color: var(--text-secondary); font-size: 13px; }
.controls { padding: 0 16px 8px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.controls button {
  font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--panel); color: var(--text-primary); cursor: pointer; min-width: 44px;
}
.controls input[type=range] { flex: 1; min-width: 160px; accent-color: var(--accent); }
.controls .time { font-variant-numeric: tabular-nums; min-width: 150px; font-weight: 600; }
#map { min-height: 300px; }
.legend { padding: 8px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; color: var(--text-secondary); font-size: 12px; }
.legend .bar { height: 10px; flex: 1; max-width: 360px; border-radius: 2px; }
.ticks { display: flex; justify-content: space-between; max-width: 360px; flex: 1; font-variant-numeric: tabular-nums; }
.legend .hint { flex-basis: 100%; }
@media (min-width: 720px) { .legend .hint { flex-basis: auto; } }
#detail {
  border-top: 1px solid var(--border); background: var(--panel); padding: 12px 16px; display: none;
}
#detail.open { display: block; }
#detail h2 { font-size: 14px; margin: 0 0 4px; }
#detail .meta { color: var(--text-secondary); font-size: 12px; margin-bottom: 8px; }
.chart-legend { display: flex; gap: 16px; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
.chart-legend span::before { content: ""; display: inline-block; width: 14px; height: 2px; margin-right: 6px; vertical-align: middle; background: var(--c); }
#chart { width: 100%; height: 180px; display: block; }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 8px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.15); display: none; }
.chart-wrap { position: relative; }
.msg { padding: 16px; color: var(--text-secondary); }
.close { float: right; background: none; border: 0; color: var(--text-secondary); font-size: 18px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>Temperatura prevista en Catalunya</h1>
  <span class="sub" id="issued">Cargando…</span>
</header>
<div class="controls">
  <button id="play" aria-label="Reproducir">▶</button>
  <input type="range" id="slider" min="0" max="0" value="0" aria-label="Hora de previsión">
  <span class="time" id="time">–</span>
</div>
<div id="map"></div>
<div>
  <div class="legend">
    <span>°C</span>
    <div style="flex:1; min-width:200px; max-width:360px">
      <div class="bar" id="legend-bar"></div>
      <div class="ticks" id="legend-ticks"></div>
    </div>
    <span class="hint">Haz clic en el mapa para ver la evolución en un punto</span>
  </div>
  <div id="detail">
    <button class="close" id="close" aria-label="Cerrar">×</button>
    <h2 id="detail-title">Punto</h2>
    <div class="meta" id="detail-meta"></div>
    <div class="chart-legend">
      <span style="--c: var(--series-1)">Previsión corregida</span>
      <span style="--c: var(--series-2)">Media de modelos sin corregir</span>
    </div>
    <div class="chart-wrap"><svg id="chart" role="img" aria-label="Evolución de la temperatura"></svg><div class="tip" id="tip"></div></div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const fmtTime = new Intl.DateTimeFormat("es-ES", { weekday: "short", day: "numeric", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Madrid" });
const isDark = () => getComputedStyle(document.documentElement).colorScheme === "dark";

const map = L.map("map", { zoomControl: true }).fitBounds([[40.52, 0.16], [42.86, 3.33]]);
const tiles = (dark) => L.tileLayer(`https://{s}.basemaps.cartocdn.com/${dark ? "dark_all" : "light_all"}/{z}/{x}/{y}{r}.png`, {
  attribution: "&copy; OpenStreetMap &copy; CARTO", subdomains: "abcd", maxZoom: 12,
});
let base = tiles(isDark()).addTo(map);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { map.removeLayer(base); base = tiles(isDark()).addTo(map); });

let meta = null, overlay = null, idx = 0, timer = null, marker = null, series = null;

function setHour(i) {
  idx = i;
  $("slider").value = i;
  $("time").textContent = fmtTime.format(new Date(meta.times[i]));
  const b = meta.bounds; // [lon_min, lat_min, lon_max, lat_max]
  const bounds = [[b[1], b[0]], [b[3], b[2]]];
  if (!overlay) overlay = L.imageOverlay(meta.images[i], bounds, { opacity: 0.8 }).addTo(map);
  else overlay.setUrl(meta.images[i]);
  if (series) drawChart();
}

function legend(stops) {
  const min = stops[0][0], max = stops[stops.length - 1][0];
  $("legend-bar").style.background = `linear-gradient(to right, ${stops.map(([t, c]) => `${c} ${(100 * (t - min) / (max - min)).toFixed(1)}%`).join(",")})`;
  $("legend-ticks").innerHTML = [min, 0, 15, 30, max].map((t) => `<span>${t}</span>`).join("");
}

async function init() {
  const r = await fetch("/api/meta");
  if (!r.ok) { $("issued").textContent = "Todavía no hay previsión disponible."; return; }
  meta = await r.json();
  const parts = [`Emitida ${fmtTime.format(new Date(meta.issued))}`, meta.ml_correction ? "corrección ML activa" : "sin modelo ML (solo media + altitud)"];
  if (meta.nowcast) parts.push(`nowcasting con ${meta.nowcast.stations} estaciones`);
  $("issued").textContent = parts.join(" · ");
  $("slider").max = meta.times.length - 1;
  legend(meta.palette);
  setHour(0);
}

$("slider").addEventListener("input", (e) => setHour(+e.target.value));
$("play").addEventListener("click", () => {
  if (timer) { clearInterval(timer); timer = null; $("play").textContent = "▶"; return; }
  $("play").textContent = "❚❚";
  timer = setInterval(() => setHour((idx + 1) % meta.times.length), 700);
});
$("close").addEventListener("click", () => { $("detail").classList.remove("open"); series = null; if (marker) map.removeLayer(marker); });

map.on("click", async (e) => {
  const r = await fetch(`/api/point?lat=${e.latlng.lat.toFixed(4)}&lon=${e.latlng.lng.toFixed(4)}`);
  if (!r.ok) return;
  series = await r.json();
  if (marker) map.removeLayer(marker);
  marker = L.circleMarker([series.lat, series.lon], { radius: 6, weight: 2, color: "#fff", fillColor: "#0b0b0b", fillOpacity: 1 }).addTo(map);
  $("detail-title").textContent = `${series.lat.toFixed(2)}° N, ${series.lon.toFixed(2)}° E`;
  $("detail").classList.add("open");
  drawChart();
});

function drawChart() {
  const svg = $("chart"), W = svg.clientWidth, H = 180, m = { l: 36, r: 12, t: 8, b: 22 };
  const css = getComputedStyle(document.documentElement);
  const c1 = css.getPropertyValue("--series-1"), c2 = css.getPropertyValue("--series-2");
  const grid = css.getPropertyValue("--grid"), muted = css.getPropertyValue("--text-muted");
  const n = series.times.length, vals = [...series.corregido, ...series.media_modelos].filter((v) => v !== null);
  const lo = Math.floor(Math.min(...vals) - 1), hi = Math.ceil(Math.max(...vals) + 1);
  const x = (i) => m.l + (W - m.l - m.r) * i / Math.max(1, n - 1);
  const y = (v) => m.t + (H - m.t - m.b) * (hi - v) / (hi - lo);
  const path = (arr) => arr.map((v, i) => v === null ? "" : `${i && arr[i - 1] !== null ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const step = Math.max(1, Math.ceil((hi - lo) / 4));
  let s = "";
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step)
    s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${grid}"/><text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="${muted}">${v}°</text>`;
  series.times.forEach((t, i) => {
    const d = new Date(t);
    if (d.getUTCHours() === 0) s += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="${muted}">${d.toLocaleDateString("es-ES", { weekday: "short", day: "numeric" })}</text>`;
  });
  s += `<line x1="${x(idx)}" x2="${x(idx)}" y1="${m.t}" y2="${H - m.b}" stroke="${muted}" stroke-dasharray="3 3"/>`;
  s += `<path d="${path(series.media_modelos)}" fill="none" stroke="${c2}" stroke-width="2"/>`;
  s += `<path d="${path(series.corregido)}" fill="none" stroke="${c1}" stroke-width="2"/>`;
  s += `<line id="cross" y1="${m.t}" y2="${H - m.b}" stroke="${muted}" visibility="hidden"/>`;
  svg.innerHTML = s;
  const cur = series.corregido[idx];
  $("detail-meta").textContent = cur === null ? "" : `${fmtTime.format(new Date(series.times[idx]))}: ${cur.toFixed(1)} °C previstos`;
  svg.onmousemove = (ev) => {
    const rect = svg.getBoundingClientRect(), i = Math.round((ev.clientX - rect.left - m.l) / (W - m.l - m.r) * (n - 1));
    if (i < 0 || i >= n) return;
    const cross = svg.querySelector("#cross");
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("visibility", "visible");
    const f = (v) => v === null ? "–" : `${v.toFixed(1)} °C`;
    $("tip").innerHTML = `<b>${fmtTime.format(new Date(series.times[i]))}</b><br>Corregida: ${f(series.corregido[i])}<br>Media modelos: ${f(series.media_modelos[i])}`;
    $("tip").style.display = "block";
    $("tip").style.left = `${Math.min(x(i) + 12, W - 170)}px`;
    $("tip").style.top = "8px";
  };
  svg.onmouseleave = () => { $("tip").style.display = "none"; svg.querySelector("#cross").setAttribute("visibility", "hidden"); };
}
addEventListener("resize", () => series && drawChart());
init();
</script>
</body>
</html>
