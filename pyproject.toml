[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meteo-cat"
version = "0.1.0"
description = "Predicción meteorológica para Catalunya: corrección ML de modelos numéricos con estaciones y orografía."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "requests>=2.31",
    "rasterio>=1.3",
    "shapely>=2.0",
    "lightgbm>=4.1",
    "matplotlib>=3.8",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
meteo-cat = "meteo_cat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
